name: Overlay and link checks

on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Checks on upstream main
        run: bin/check --upstream
  # private repo 的 macOS runner 以 10 倍計費（#87）：只在 PR、每週與手動觸發時跑，push 只跑上面的 ubuntu。
  # steps 與 ubuntu job 一字不差（tests/ci-workflow-jobs.test.mjs 比對）。
  checks-macos:
    if: github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Checks on upstream main
        run: bin/check --upstream
