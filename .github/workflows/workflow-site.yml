name: Workflow site publish

# 合入 main 後把 docs/workflow/ 部署到 Cloudflare Pages 專案 ron-skills-workflow（#11）。
# PR 不部署：檢查（含重產比對與機密掃描）由 checks.yml 的 bin/check 跑。
# secrets 由 Operator 用 scripts/setup-workflow-site.sh 設定：CLOUDFLARE_API_TOKEN（只有 Pages 編輯權限）、CLOUDFLARE_ACCOUNT_ID。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-site-publish
  cancel-in-progress: false

jobs:
  publish:
    # workflow_dispatch 也只能從 main 跑：部署固定用 --branch=main，其他 ref 會被當成正式版上線。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - name: Checks on upstream main
        run: bin/check --upstream
      # wrangler 版本與 scripts/setup-workflow-site.sh 的 WRANGLER 一起改。
      - name: Deploy docs/workflow to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 pages deploy docs/workflow --project-name=ron-skills-workflow --branch=main --commit-hash="$GITHUB_SHA"
      # 部署後驗證要有線上站，所以不在 bin/check 內。
      - name: Verify every file at the fixed URL
        run: node scripts/verify-workflow-deploy.mjs docs/workflow https://ron-skills-workflow.pages.dev
