name: Project batch trial contracts

on:
  push:
    paths:
      - 'skills/in-progress/project-batch/**'
      - 'tests/project-batch/**'
      - '.github/workflows/project-batch-tests.yml'
  pull_request:
    paths:
      - 'skills/in-progress/project-batch/**'
      - 'tests/project-batch/**'
      - '.github/workflows/project-batch-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - name: Independent batch and extension tests (no credentials)
        run: node --test tests/project-batch/*.test.mjs
